<!-- داخل تب youtube-research -->
<div class="yt-search-box">
  <input type="text" id="yt-query" placeholder="جستجو در یوتیوب..." value="{{ yt_query }}">
  <button onclick="ytSearch()">جستجو</button>
</div>
<div id="yt-results" class="video-grid">
  {% include "dashboard/_yt_video_cards.html" %} <!-- یا هر ساختاری که الان دارید -->
</div>

<script>
function renderYtVideos(videos) {
  const container = document.getElementById('yt-results');
  container.innerHTML = videos.map(v => `
    <div class="video-card">
      <img src="${v.thumbnail}" alt="${v.title}">
      <h4>${v.title}</h4>
      <span>${v.channel} · ${v.duration}</span>
    </div>
  `).join('');
}

async function ytSearch() {
  const q = document.getElementById('yt-query').value;
  const res = await fetch(`/dashboard/youtube/search?q=${encodeURIComponent(q)}`);
  const data = await res.json();
  renderYtVideos(data.videos);
}

document.getElementById('yt-query').addEventListener('keypress', e => {
  if (e.key === 'Enter') ytSearch();
});
</script>
