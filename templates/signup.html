<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ثبت‌نام — دستیار SEO</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-body">
  <div class="auth-card">
    <h1 class="auth-title">🔎 ساخت حساب کاربری</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="status {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('auth.signup') }}" class="auth-form">
      <label for="email">ایمیل</label>
      <input type="email" id="email" name="email" value="{{ email }}" placeholder="example@domain.com" required autofocus>

      <label for="password">رمز عبور</label>
      <input type="password" id="password" name="password" placeholder="حداقل ۸ کاراکتر" minlength="8" required>

      <label for="confirm_password">تکرار رمز عبور</label>
      <input type="password" id="confirm_password" name="confirm_password" placeholder="تکرار رمز عبور" minlength="8" required>

      <button type="submit" class="auth-btn">ثبت‌نام</button>
    </form>

    <p class="auth-switch">
      حساب کاربری دارید؟ <a href="{{ url_for('auth.login') }}">وارد شوید</a>
    </p>
  </div>
</body>
</html>
